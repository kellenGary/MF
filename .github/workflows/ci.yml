# CI - Runs on every PR to dev, staging, and main
# Ensures code compiles before merging

name: CI

on:
  pull_request:
    branches: [dev, staging, main]

jobs:
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/petalAPI
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Uncomment when you have tests
      # - name: Test
      #   run: dotnet test --no-build --configuration Release

  build-mobile:
    name: Build Mobile (TypeScript Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

  # Gate to enforce correct PR targets
  branch-rules:
    name: Branch Rules
    runs-on: ubuntu-latest
    steps:
      - name: Check PR target
        run: |
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"

          echo "PR: $HEAD → $BASE"

          # main can only receive PRs from staging or hotfix/*
          if [[ "$BASE" == "main" ]]; then
            if [[ "$HEAD" != "staging" && "$HEAD" != hotfix/* ]]; then
              echo "❌ Only 'staging' or 'hotfix/*' branches can be merged into 'main'."
              echo "   Got: '$HEAD' → 'main'"
              exit 1
            fi
          fi

          # staging can only receive PRs from dev or hotfix/*
          if [[ "$BASE" == "staging" ]]; then
            if [[ "$HEAD" != "dev" && "$HEAD" != hotfix/* ]]; then
              echo "❌ Only 'dev' or 'hotfix/*' branches can be merged into 'staging'."
              echo "   Got: '$HEAD' → 'staging'"
              exit 1
            fi
          fi

          echo "✅ Branch rule check passed: $HEAD → $BASE"
